name: Build Ganpati Utsav APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          echo "Android project found:"
          find project -maxdepth 3 -type f | sort

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GanpatiUtsavAccounts-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
