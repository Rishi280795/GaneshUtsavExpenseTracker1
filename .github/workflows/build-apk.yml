name: Build Ganesh Utsav APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          set -e
          ZIP="GaneshUtsavExpenseTracker1-Background-Updated.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repository root."
            exit 1
          fi
          rm -rf __android_project
          mkdir __android_project
          unzip -q "$ZIP" -d __android_project
          rsync -a __android_project/ ./
          rm -rf __android_project
          echo "Android project extracted."
          echo "settings.gradle.kts:"; test -f settings.gradle.kts && echo "OK"
          echo "app/build.gradle.kts:"; test -f app/build.gradle.kts && echo "OK"
          echo "MainActivity.kt:"; test -f app/src/main/java/com/ganpati/utsav/MainActivity.kt && echo "OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GaneshUtsavExpenseTracker1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
